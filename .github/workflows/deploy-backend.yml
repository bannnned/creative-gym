name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-backend.yml"
      - "apps/api/**"
      - "deploy/timeweb/vps/**"
      - "docker-compose.timeweb-vps.example.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creative-gym-production-backend
  cancel-in-progress: false

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Run API tests
        working-directory: apps/api
        run: go test ./...

      - name: Validate VPS scripts
        run: |
          bash -n deploy/timeweb/vps/auto-deploy.sh
          bash -n deploy/timeweb/vps/backup-postgres.sh
          bash -n deploy/timeweb/vps/restore-check.sh

      - name: Build API image
        run: |
          docker build \
            --build-arg BUILD_SHA="$GITHUB_SHA" \
            --tag creative-gym-api:test \
            apps/api
          docker image inspect creative-gym-api:test \
            --format '{{json .Config.Healthcheck}}' |
            grep -q '/readyz'

  verify:
    name: Verify Timeweb VPS deployment
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://creative.gde-kofe.ru

    steps:
      - name: Wait for VPS auto-deploy
        env:
          API_URL: https://creative.gde-kofe.ru
        run: |
          deployed=false
          for attempt in $(seq 1 120); do
            ready_status="$(curl --silent --show-error --max-time 10 \
              --output /dev/null --write-out '%{http_code}' \
              "$API_URL/readyz" || true)"
            auth_status="$(curl --silent --show-error --max-time 10 \
              --output /dev/null --write-out '%{http_code}' \
              "$API_URL/api/v1/auth/me" || true)"
            version="$(curl --silent --show-error --max-time 10 \
              "$API_URL/versionz" || true)"

            if [ "$ready_status" = 200 ] &&
              [ "$auth_status" = 401 ] &&
              printf '%s' "$version" |
                grep -q "\"commit\":\"$GITHUB_SHA\""; then
              deployed=true
              break
            fi

            echo "Waiting for $GITHUB_SHA: ready=$ready_status auth=$auth_status version=$version"
            sleep 3
          done

          if [ "$deployed" != true ]; then
            echo "VPS did not deploy $GITHUB_SHA within the verification window."
            exit 1
          fi
