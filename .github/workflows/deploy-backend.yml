name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-backend.yml"
      - "apps/api/**"
      - "deploy/timeweb/vps/**"
      - "docker-compose.timeweb-vps.example.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creative-gym-production-backend
  cancel-in-progress: false

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Run API tests
        working-directory: apps/api
        run: go test ./...

  deploy:
    name: Deploy API to Timeweb VPS
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://creative.gde-kofe.ru

    steps:
      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$VPS_SSH_PRIVATE_KEY"
          test -n "$VPS_SSH_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/creative_gym_deploy"
          chmod 600 "$HOME/.ssh/creative_gym_deploy"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy exact commit
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          remote_script="$(mktemp)"
          trap 'rm -f "$remote_script"' EXIT

          cat > "$remote_script" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          deploy_sha="$1"
          project_dir="/opt/creative-gym"
          compose_file="docker-compose.vps.yml"

          cd "$project_dir"

          if ! git diff --quiet || ! git diff --cached --quiet; then
            echo "Tracked changes exist on the VPS. Refusing to overwrite them."
            git status --short
            exit 1
          fi

          git fetch --prune origin main
          git cat-file -e "${deploy_sha}^{commit}"
          git checkout main
          git merge --ff-only "$deploy_sha"

          docker compose -f "$compose_file" config --quiet
          docker compose -f "$compose_file" build --pull api
          docker compose -f "$compose_file" run --rm api /app/db migrate
          docker compose -f "$compose_file" up -d --no-deps api

          ready=false
          for attempt in $(seq 1 30); do
            if docker compose -f "$compose_file" exec -T api \
              wget -qO- http://127.0.0.1:8080/readyz |
              grep -q '"status":"ok"'; then
              ready=true
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            echo "API did not become ready after deployment."
            docker compose -f "$compose_file" ps
            docker compose -f "$compose_file" logs --tail 150 api
            exit 1
          fi

          docker compose -f "$compose_file" ps
          docker compose -f "$compose_file" logs --since 2m api |
            grep -E 'config loaded|s3_enabled|s3_complete|s3 client' || true
          REMOTE_SCRIPT

          deployed=false
          for attempt in 1 2 3 4; do
            echo "SSH deployment attempt $attempt of 4"
            if ssh \
              -i "$HOME/.ssh/creative_gym_deploy" \
              -p "${VPS_PORT:-22}" \
              -o BatchMode=yes \
              -o ConnectTimeout=15 \
              -o ConnectionAttempts=2 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" \
              bash -s -- "$GITHUB_SHA" < "$remote_script"; then
              deployed=true
              break
            fi

            sleep $((attempt * 5))
          done

          test "$deployed" = true

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/creative_gym_deploy"
